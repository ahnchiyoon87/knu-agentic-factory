# 내 공장 — 이 한 벌이 학생 PC 에서 전부 돈다. 바깥에 서버가 없다.
#
#   docker compose up -d       켠다  →  http://localhost:8000
#   docker compose down        끈다  (데이터는 남는다)
#   docker compose down -v     끄고 데이터까지 지운다 — 공장 초기화
#
# DB 도 여기 들어 있다. 학생끼리 아무것도 공유하지 않는다 —
# 다 같이 쓰는 것은 3일차의 AI 열쇠 하나뿐이다.

# 폴더 이름이 한글이라 compose 가 프로젝트 이름을 못 만든다 — 박아 둔다.
name: knu-factory

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: local        # 내 컴퓨터 안에서만 쓰는 값이다 — 비밀이 아니다
    volumes:
      - factory-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  factory:
    build: .
    image: knu-factory:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env                          # AI 열쇠(3일차)와 제어 개방이 여기 있다
    environment:
      SUPABASE_DB_URL: postgresql://postgres:local@db:5432/postgres
      MY_TENANT: S01                  # 전원이 같다 — DB 가 각자 것이라 부딪히지 않는다
      TENANT_FILTER: S01
      DB_POOL_MIN: "1"
      DB_POOL_MAX: "4"
    restart: unless-stopped

volumes:
  factory-db:
